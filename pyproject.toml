[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "md-chunk-lite"
version = "1.1.1"
description = "Split Markdown into chunks by heading. Each chunk keeps its heading path and line numbers. CLI and MCP server. Runs locally."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "Tidy Byte Tools"}]
requires-python = ">=3.10"
dependencies = [
  "mcp>=1.10,<2",
]
keywords = ["markdown", "chunking", "text-splitter", "rag", "llm", "embeddings", "headings", "jsonl", "cli", "mcp", "mcp-server"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Text Processing :: Markup :: Markdown",
  "Topic :: Text Processing :: Indexing",
  "Topic :: Utilities",
]

[project.urls]
Homepage = "https://tidybytetools.github.io/tools/markdown-chunker/"
Documentation = "https://tidybytetools.github.io/tools/markdown-chunker/"
Source = "https://github.com/tidybytetools/md-chunk-lite"
Issues = "https://github.com/tidybytetools/md-chunk-lite/issues"
Changelog = "https://github.com/tidybytetools/md-chunk-lite/blob/main/CHANGELOG.md"
Buy = "https://tidybyte.gumroad.com/l/frlkv"


[project.scripts]
md-chunk-lite = "md_chunk_lite:main"
md-chunk-lite-mcp = "md_chunk_lite_mcp:main"

[tool.setuptools]
py-modules = ["md_chunk_lite", "md_chunk_lite_mcp"]
